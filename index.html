<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">架空百科事典</title>
<link rel="stylesheet" href="css/wiki.css">
</head>
<body>

<!-- ヘッダー -->
<header id="site-header">
  <div id="header-inner">
    <div id="header-logo">
      <div id="logo-mark">
        <svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="25" cy="25" r="23" stroke="#a2a9b1" stroke-width="1.5" fill="none"/>
          <circle cx="25" cy="25" r="16" stroke="#a2a9b1" stroke-width="1" fill="none"/>
          <ellipse cx="25" cy="25" rx="8" ry="23" stroke="#a2a9b1" stroke-width="1" fill="none"/>
          <line x1="2" y1="25" x2="48" y2="25" stroke="#a2a9b1" stroke-width="1"/>
          <line x1="25" y1="2" x2="25" y2="48" stroke="#a2a9b1" stroke-width="1"/>
        </svg>
      </div>
      <div id="logo-text">
        <div id="logo-name" onclick="loadArticle('main')" style="cursor:pointer"></div>
        <div id="logo-tagline"></div>
      </div>
    </div>
    <div id="header-search">
      <form id="search-form" onsubmit="doSearch(event)">
        <input type="text" id="search-input" placeholder="百科事典を検索">
        <button type="submit" id="search-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </form>
    </div>
  </div>
</header>

<!-- タブバー -->
<div id="tab-bar">
  <div id="tab-bar-inner">
    <div id="page-tabs">
      <span class="tab active" id="tab-article">記事</span>
      <span class="tab" id="tab-talk">ノート</span>
    </div>
    <div id="page-actions">
      <span class="action-link">閲覧</span>
      <span class="action-link">編集</span>
      <span class="action-link">履歴表示</span>
    </div>
  </div>
</div>

<!-- メインレイアウト -->
<div id="content-wrap">

  <!-- 左ナビ -->
  <nav id="sidebar">
    <div class="nav-section">
      <h3 class="nav-heading">ナビゲーション</h3>
      <ul>
        <li><a href="#" onclick="loadArticle('main');return false">メインページ</a></li>
        <li><a href="#" onclick="showAllArticles();return false">記事一覧</a></li>
        <li><a href="#" onclick="showRandom();return false">おまかせ表示</a></li>
      </ul>
    </div>
    <div class="nav-section" id="cat-nav">
      <h3 class="nav-heading">カテゴリ</h3>
      <ul id="cat-nav-list"></ul>
    </div>
    <div class="nav-section">
      <h3 class="nav-heading">このサイトについて</h3>
      <ul>
        <li><a href="#" onclick="showNotice();return false">免責事項</a></li>
      </ul>
    </div>
  </nav>

  <!-- 記事エリア -->
  <main id="article-area">
    <div id="article-content">
      <!-- JS で描画 -->
    </div>
  </main>

</div>

<!-- フッター -->
<footer id="site-footer">
  <div id="footer-inner">
    <p id="footer-notice"></p>
    <p id="footer-links">
      <a href="#">プライバシーポリシー</a> ·
      <a href="#">免責事項</a> ·
      <a href="#">お問い合わせ</a>
    </p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/wiki.js"></script>
</body>
</html>
